name: Build & Sign SP Notes APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
          echo "✅ Keystore decoded"

      - name: Verify Keystore
        run: |
          keytool -list \
            -keystore app/keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -v
          echo "✅ Keystore valid"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)/apksigner verify \
            --verbose --print-certs "$APK"
          echo "✅ APK signature verified"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sp-notes-signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/keystore.jks
